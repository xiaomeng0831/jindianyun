name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述使用场景，而不是直接说方案
      placeholder: 晚上回宿舍前想先看哪栋楼还有空位，但现在得一个个点开……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      placeholder: 在地图上直接显示每栋楼附近的空闲插口数……
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
